; ESP32-POE-ISO <-> ESP32-POE-ISO JSON-over-SPI link via the UEXT1 connector.
;
; Build/flash one board as the SPI master ("server") and the other as the
; SPI slave ("client"):
;   pio run -e server -t upload --upload-port /dev/cu.usbserial-XXXX
;   pio run -e client -t upload --upload-port /dev/cu.usbserial-YYYY
;
; The JSON payload is include/meter_snapshot.h (regenerate with
; tools/snapshot_meters.py). See README.md for wiring, control flow and caveats.

[env]
platform = espressif32
board = esp32-poe-iso
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
build_flags =
    -DSPI_CLOCK_HZ=8000000   ; SCK; master uses 80 MHz / n (8, 8.9, 10, 11.4, 13.3, 16, 20 MHz ...)
    -DSPI_MODE_NUM=1         ; mode 1 recommended for the ESP32 slave when DMA is used
    -DMAX_FRAME_SIZE=16384   ; buffer size on both boards; the JSON may grow to this minus 12 bytes
    -DUSE_HANDSHAKE=1        ; client->server "ready" line on UEXT pin 3 (GPIO4)
    -DSEND_INTERVAL_US=0     ; 0 = back to back, as fast as the client can keep up
    -DREPORT_EVERY=100       ; one summary line per 100 transactions
    -DVERBOSE_LOG=0          ; 1 = per-transaction CS/hexdump/JSON trace (also set SEND_INTERVAL_US=1000000)

[env:server]
build_flags = ${env.build_flags} -DROLE_SERVER

[env:client]
build_flags = ${env.build_flags} -DROLE_CLIENT
